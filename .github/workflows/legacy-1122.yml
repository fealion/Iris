name: Forge 1.12.2 shader pipeline (Java 8)

on:
  push:
    paths:
      - '.gitmodules'
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build pinned AUSM Java 8 distributable
        working-directory: legacy-1.12.2/shader-pipeline
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assemble
      - uses: actions/upload-artifact@v4
        with:
          name: iris-compatible-shader-pipeline-forge-1.12.2-java8
          path: legacy-1.12.2/shader-pipeline/build/libs/AUSM-*-Java8.jar
          if-no-files-found: error
